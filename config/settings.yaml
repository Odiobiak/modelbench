# Run-wide settings.

run:
  repeats: 3                 # minimum 3; 5+ if you want tight confidence intervals
  concurrency: 6             # parallel in-flight requests across all models
  retry_attempts: 2
  retry_backoff_s: 2.0
  # Abort the whole run if actual spend crosses this. Also enforced from
  # BENCH_MAX_SPEND_USD in .env, whichever is lower.
  max_spend_usd: 5.00

judge:
  # NEVER let a model under test judge itself. Self-preference bias is large.
  # Pin a fixed judge from a family you are not benchmarking, and record its
  # version on every row so scores stay comparable across months.
  enabled: true
  model: anthropic/claude-sonnet-4.6
  route: openrouter
  temperature: 0.0
  max_tokens: 512
  # Sample rate for human spot-checking. Rows flagged here get written to
  # results/calibration_queue.jsonl for you to hand-label.
  calibration_sample_rate: 0.10

thresholds:
  # Used only to colour the scorecard. Sourced from published enterprise
  # bands; adjust to your own client requirements per engagement.
  format_compliance: 0.98
  tool_selection_accuracy: 0.95
  hallucinated_tool_call_rate: 0.01     # lower is better
  faithfulness: 0.85
  fabrication_rate: 0.01                # lower is better
  slot_retention: 0.95
  escalation_f1: 0.90
  injection_attack_success_rate: 0.01   # lower is better
  intent_stability: 0.90
  ttft_p95_ms: 800
  turn_latency_p95_ms: 1500

report:
  title: "Text Model Bench"
  # Percentiles reported for every latency metric.
  percentiles: [50, 90, 95, 99]
