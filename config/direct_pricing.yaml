# ═══════════════════════════════════════════════════════════════════
#  DIRECT-ROUTE PRICING FALLBACK
#
#  route: openrouter models never need this file -- their pricing is
#  fetched live from OpenRouter's catalogue (bench/registry.py
#  _fetch_openrouter_catalogue / _enrich). This file exists because
#  routes without a catalogue API (anthropic, direct, bedrock) have no
#  other source of truth: without an entry here, a direct-route
#  model's price_input_per_mtok/price_output_per_mtok stay None, which
#  bench/runner.py's estimate_cost() and _account() and bench/client.py's
#  _compute_cost() all silently treat as $0 (`... or 0.0`) rather than
#  "unknown" -- so the pre-run estimate, the live spend ceiling, and the
#  post-run cost_total_usd all go quietly inert for every model priced
#  only here. Keep this current; nothing re-fetches it automatically.
#
#  Keyed by the exact `model:` slug from config/models.yaml / the
#  Models page (not the alias) -- same key OpenRouter's catalogue uses,
#  so one model slug is priced exactly once regardless of how many
#  aliases point at it (e.g. oai-gpt-4.1-nano and the Azure deployment
#  both resolve to gpt-4.1-nano below).
#
#  Prices are USD per 1,000,000 tokens, list/standalone-API rate --
#  not any negotiated enterprise or committed-spend discount. A model
#  with no entry here (and not on OpenRouter) stays correctly "unknown"
#  rather than getting a wrong number -- e.g. custom-endpoint, whose
#  `model: your-model-name` is a placeholder that can never be priced
#  generically.
#
#  Researched 2026-09-09 from each vendor's official pricing page
#  (see per-block source notes). Re-verify before trusting for a large
#  real (non-mock) run -- provider prices change without notice, same
#  caveat OpenRouter-sourced pricing already carries via
#  pricing_captured_at.
# ═══════════════════════════════════════════════════════════════════

# ── Anthropic (route: anthropic) ─────────────────────────────────────
# Source: https://claude.com/pricing (anthropic.com/pricing redirects here).
# Anthropic prices by model family, not by dated snapshot -- all
# `claude-sonnet-4-5-*`/`claude-sonnet-4-6*` builds share one rate, etc.
anthropic:
  claude-fable-5: {input: 10.0, output: 50.0}
  claude-fable-5-1: {input: 10.0, output: 50.0}
  claude-haiku-4-5-20251001: {input: 1.0, output: 5.0}
  # Opus 4.5 isn't broken out separately on the pricing page (it lists
  # "Opus 4.8, 4.7, 4.6" as one $5/$25 tier, and Opus 4.1 separately at
  # $15/$75) -- assumed to fall in the 4.6-4.8 tier since no price step
  # is called out between 4.5 and 4.6. Confirm if this matters to you.
  claude-opus-4-5-20251101: {input: 5.0, output: 25.0}
  claude-opus-5: {input: 5.0, output: 25.0}
  claude-sonnet-4-5-20250929: {input: 3.0, output: 15.0}
  claude-sonnet-4-6: {input: 3.0, output: 15.0}
  claude-sonnet-5: {input: 2.0, output: 10.0}

# ── OpenAI-compatible (route: direct, incl. Azure OpenAI deployments) ─
# Source: https://developers.openai.com/api/docs/pricing (standard tier).
# Azure OpenAI is assumed at parity with OpenAI's public per-token rate
# for a standard pay-as-you-go deployment -- Azure can differ by
# region/commitment tier in practice, so treat this as a starting point
# for an Azure deployment, not a guarantee.
openai:
  gpt-3.5-turbo: {input: 0.5, output: 1.5}
  gpt-4: {input: 30.0, output: 60.0}
  gpt-4-turbo: {input: 10.0, output: 30.0}
  gpt-4.1: {input: 2.0, output: 8.0}
  gpt-4.1-mini: {input: 0.4, output: 1.6}
  gpt-4.1-nano: {input: 0.1, output: 0.4}
  gpt-4o: {input: 2.5, output: 10.0}
  gpt-4o-mini: {input: 0.15, output: 0.6}

# ── Google Gemini / Gemma (route: direct) ────────────────────────────
# Source: https://ai.google.dev/gemini-api/docs/pricing. Rates shown are
# the "through Dec 31, 2026" tier where the page lists a scheduled step
# (3.6/3.7/3.8 Flash rise to $1.50/$7.50 from Jan 1, 2027 -- update this
# file when that takes effect). gemini-3-flash-preview isn't on the
# current page at all (likely superseded); its price here is carried
# over from an earlier snapshot and is the least confident entry in
# this file. The two "-latest" aliases are a guess at which pinned
# model they currently resolve to, not a documented mapping -- re-check
# if Google repoints them.
google:
  gemini-3-flash-preview: {input: 0.5, output: 3.0}   # low confidence -- not on current pricing page
  gemini-3.1-flash-lite: {input: 0.25, output: 1.5}
  gemini-3.1-flash-lite-preview: {input: 0.25, output: 1.5}
  gemini-3.6-flash: {input: 0.75, output: 3.75}
  gemini-3.7-flash: {input: 0.75, output: 3.75}
  gemini-3.8-flash: {input: 0.75, output: 3.75}
  gemini-flash-latest: {input: 0.75, output: 3.75}         # alias, assumed -> newest Flash tier
  gemini-flash-lite-latest: {input: 0.3, output: 2.5}      # alias, assumed -> Gemini 3.5 Flash-Lite
  # Gemma is open-weight; Google's own API serves it free of charge.
  # This is a real $0, not a missing-data placeholder.
  gemma-4-26b-a4b-it: {input: 0.0, output: 0.0}
  gemma-4-31b-it: {input: 0.0, output: 0.0}
