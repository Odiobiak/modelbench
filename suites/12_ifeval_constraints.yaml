  tags:
  - instruction-following
  - change_case
  - startend
  input: Write me a resume for Matthias Algiers. Use words with all capital letters to highlight key abilities,
    but make sure that words with all capital letters appear less than 10 times. Wrap the entire response
    with double quotation marks.
  judge:
